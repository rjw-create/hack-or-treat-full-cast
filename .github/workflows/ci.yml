name: CI

# Runs the no-credit checks only. Nothing here calls ElevenLabs or needs a key or secret:
# the pipeline tests use a fake client, and the real client only runs via `python -m core run`.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # FFmpeg is needed for the placeholder stems and the audio-check tests in the full check.
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Run checks
        run: bash scripts/check.sh
